<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Run Faster – jouw persoonlijke hardloopcoach</title>
<meta name="description" content="Persoonlijke hardlooptrainingsschema's op maat: tempo, uithoudingsvermogen en snelheid, aangepast aan je doelen, hitte en hellingen. Met Garmin-import.">
<meta name="theme-color" content="#0f5c4c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Run Faster – jouw persoonlijke hardloopcoach">
<meta property="og:description" content="Trainingsschema's op maat die zich aanpassen aan je doelen en omstandigheden.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vanhunsel39.github.io/run-faster/">
<meta property="og:image" content="https://vanhunsel39.github.io/run-faster/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://vanhunsel39.github.io/run-faster/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<script defer src="js/units.js"></script>
<script defer src="js/vdot.js"></script>
<script defer src="js/conditions.js"></script>
<script defer src="js/sports.js"></script>
<script defer src="js/goal.js"></script>
<script defer src="js/zones.js"></script>
<script defer src="js/load.js"></script>
<script defer src="js/planner.js"></script>
<script defer src="js/coach.js"></script>
<script defer src="js/importers.js"></script>
<script defer src="js/fitexport.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/charts.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#view">Naar de inhoud</a>

<header class="app-header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
      <rect width="32" height="32" rx="8" fill="currentColor"/>
      <path d="M7 22 L13 16 L17 19 L25 9" fill="none" stroke="var(--on-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 9 H25 V14" fill="none" stroke="var(--on-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand-name">Run Faster</span>
  </div>
  <p class="header-status" id="headerStatus"></p>
</header>

<main id="view" tabindex="-1">
  <h1>Run Faster</h1>
  <noscript><p>Deze app heeft JavaScript nodig. Zet JavaScript aan in je browser om je trainingsschema te gebruiken.</p></noscript>
  <p class="muted">Laden…</p>
</main>

<button type="button" class="fab" id="fab" data-action="fab" aria-label="Snel invoeren: run, andere sport of Garmin-bestand" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar" aria-label="Hoofdnavigatie">
  <ul>
    <li><button type="button" data-nav="today"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Vandaag</span></button></li>
    <li><button type="button" data-nav="plan"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Schema</span></button></li>
    <li><button type="button" data-nav="progress"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Voortgang</span></button></li>
    <li><button type="button" data-nav="goals"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg><span>Doelen</span></button></li>
  </ul>
</nav>

<dialog id="modal" aria-labelledby="modalTitle">
  <div class="modal-inner">
    <div class="modal-head">
      <h2 id="modalTitle">Details</h2>
      <button type="button" class="icon-btn" data-action="closeModal" aria-label="Sluiten">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="modalBody"></div>
  </div>
</dialog>

<input type="file" id="fileImport" aria-label="Garmin-bestand kiezen" accept=".fit,.gpx,.tcx,.zip,application/zip,application/gpx+xml" hidden>
<input type="file" id="fileBackup" aria-label="Back-upbestand kiezen" accept=".json,application/json" hidden>
<div id="dropHint" class="drop-hint" hidden><p>Laat je Garmin-bestand los om te importeren</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
